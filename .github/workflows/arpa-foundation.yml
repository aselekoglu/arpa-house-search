name: ARPA Foundation

on:
  push:
    branches:
      - main
      - 'arpa/**'
      - 'm1/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn build:frontend
      - name: Deterministic foundation/core tests
        run: >-
          node --import ./test/esmock-loader.mjs ./node_modules/mocha/bin/mocha.js
          --timeout 60000
          test/arpa/foundation.test.js
          test/domain/canonicalListing.test.js
          test/domain/searchProfile.test.js
          test/services/searchProfiles/profileExecutionContext.test.js
          test/storage/searchProfileMigration.test.js
          test/storage/searchProfileStorage.test.js
          test/services/searchProfiles/searchProfileLifecycleService.test.js
          test/api/searchProfileRouter.test.js
          test/api/searchProfileApiRegistration.test.js
          test/ui/searchProfileModel.test.js
          test/ui/searchProfilesUiContract.test.js
          test/providers/providerRegistry.test.js
          test/clients/realtor/realtorClient.test.js
          test/providers/realtorCaAdapter.test.js
          test/fixtures/realtorFixtures.test.js
          test/providers/customSourceRecipe.test.js
          test/providers/staticCustomSourceExtractor.test.js
          test/providers/browserCustomSourceExtractor.test.js
          test/providers/browserCustomSourceNetworkSafety.test.js
          test/providers/customSourceCanonicalMapper.test.js
          test/services/customSources/sourceTestService.test.js
          test/services/customSources/sourceLifecycleService.test.js
          test/services/customSources/sourceActivationPresentation.test.js
          test/storage/customSourceMigration.test.js
          test/storage/customSourceStorage.test.js
          test/storage/listingFeedMigration.test.js
          test/storage/canonicalListingStorage.test.js
          test/services/listingFeed/listingFeedService.test.js
          test/api/listingFeedRouter.test.js
          test/api/listingFeedApiRegistration.test.js
          test/ui/listingFeedModel.test.js
          test/ui/listingsFeedUiContract.test.js
          test/ui/listingMapModel.test.js
          test/ui/listingMapRuntimeContract.test.js
          test/ui/listingsMapUiContract.test.js
          test/storage/searchProfileRunMigration.test.js
          test/storage/searchProfileRunStorage.test.js
          test/services/searchProfiles/searchProfileExecutionService.test.js
          test/services/searchProfiles/searchProfileScheduler.test.js
          test/api/searchProfileRunNow.test.js
          test/ui/searchProfileRunNowContract.test.js
          test/services/searchProfiles/searchProfileRuntimeContract.test.js
          test/api/customSourceRouter.test.js
          test/api/customSourceApiRegistration.test.js
          test/ui/customSourceBuilderModel.test.js
          test/ui/customSourceUiContract.test.js
          test/storage/SqliteConnection.test.js
          test/similarity/similarityCache.test.js
          test/utils/utils.test.js
